# Job source registry
# Add company slugs for each ATS platform
# poll_interval_s: override per company (optional, inherits from ats default)
# priority: high = 30s polling, normal = 60s, low = 120s

defaults:
  greenhouse:
    poll_interval_s: 60
    priority: normal
  lever:
    poll_interval_s: 60
    priority: normal
  ashby:
    poll_interval_s: 60
    priority: normal
  smartrecruiters:
    poll_interval_s: 90
    priority: normal
  workable:
    poll_interval_s: 90
    priority: normal
  jobspy:
    poll_interval_s: 21600
    priority: normal

sources:
