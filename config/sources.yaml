  # ── Workday ────────────────────────────────────────────────────────────────
  - ats: workday
    slug: netflix
    name: Netflix
    priority: high
    workday_host: netflix.wd108.myworkdayjobs.com
    workday_path: Netflix
    poll_interval_s: 3600

  - ats: workday
    slug: adobe
    name: Adobe
    workday_host: adobe.wd5.myworkdayjobs.com
    workday_path: external_experienced
    poll_interval_s: 3600

  - ats: workday
    slug: cisco
    name: Cisco
    workday_host: cisco.wd5.myworkdayjobs.com
    workday_path: Cisco_Careers
    poll_interval_s: 3600

  - ats: workday
    slug: salesforce
    name: Salesforce
    workday_host: salesforce.wd12.myworkdayjobs.com
    workday_path: External_Career_Site
    poll_interval_s: 3600

  # ── Direct careers-site APIs (big tech / finance) ──────────────────────────
  - ats: careers
    slug: amazon
    name: Amazon
    site: amazon
    queries: ["data engineer", "business intelligence engineer", "analytics engineer", "university graduate data"]
    priority: high
    poll_interval_s: 1800

  - ats: careers
    slug: microsoft
    name: Microsoft
    site: microsoft
    queries: ["data engineer", "analytics engineer", "university data", "new grad software engineer data"]
    priority: high
    poll_interval_s: 1800

  - ats: careers
    slug: jpmorgan
    name: JPMorgan Chase
    site: jpmorgan
    queries: ["data engineer", "analytics engineer", "software engineer program", "data analytics associate"]
    poll_interval_s: 3600

  # ── Community GitHub new-grad lists (README tables) ────────────────────────
  - ats: github_list
    slug: simplify-new-grad
    name: GitHub - SimplifyJobs New-Grad-Positions
    repo: SimplifyJobs/New-Grad-Positions
    branch: dev
    poll_interval_s: 600

  - ats: github_list
    slug: vansh-new-grad-2027
    name: GitHub - vanshb03 New-Grad-2027
    repo: vanshb03/New-Grad-2027
    branch: dev
    poll_interval_s: 600

  - ats: github_list
    slug: zapply-ds-new-grad-2027
    name: GitHub - zapplyjobs Data Science New-Grad 2027
    repo: zapplyjobs/New-Grad-Data-Science-Jobs-2027
    branch: main
    poll_interval_s: 600

  # ── Adzuna (aggregator: Indeed + CareerBuilder + Reed + others) ────────────
  # Focus: in-person data-engineer roles in the US. Future expansion planned
  # for SWE / DE / DS / AI / ML — add new entries alongside these.
  # Free tier: ~250 req/day, 50 jobs/req. Currency auto-mapped from country.

  # Seattle (primary — user moving there for UW Sept 2025)
  - ats: adzuna
    slug: adzuna-data-engineer-seattle
    name: Adzuna — data engineer (Seattle)
    priority: high
    query: data engineer
    location: Seattle
    country: us
    max_days_old: 7
    poll_interval_s: 14400

  # Major US metros (in-person)
  - ats: adzuna
    slug: adzuna-data-engineer-san-francisco
    name: Adzuna — data engineer (San Francisco)
    query: data engineer
    location: San Francisco
    country: us
    max_days_old: 7
    poll_interval_s: 14400

  - ats: adzuna
