    poll_interval_s: 21600

  # ── JobSpy (Indeed + Google) ─────
  # Default sites are indeed+google (Tesla internships came from Indeed in JobSpy scrapes).
  - ats: jobspy
    slug: jobspy-new-grad-data-engineer
    name: JobSpy — new grad data engineer
    priority: high
    search_term: new grad data engineer OR university graduate data engineer OR junior data engineer
