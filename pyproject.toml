[project]
name = "jobtracker"
version = "0.1.0"
description = "Personal job scraper with semantic matching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # HTTP
    "httpx[http2]>=0.27",
    "aiolimiter>=1.1",
    "tenacity>=8.3",
    # Scheduling
    "apscheduler>=3.10",
    # Parsing
    "selectolax>=0.3",
    "feedparser>=6.0",
    # DB
    "sqlmodel>=0.0.19",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    # Cache
    "redis[asyncio]>=5.0",
    # Embeddings
    "sentence-transformers>=3.0",
    # Hashing
    "xxhash>=3.4",
    # Config
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # CLI
    "typer>=0.12",
    # Logging
    "structlog>=24.1",
    # Metrics
    "prometheus-client>=0.20",
    "python-dotenv>=1.2.2",
    # Multi-board search (Indeed/Google)
    "python-jobspy>=1.1.82",
    "pandas>=2.0",
    # JobSpy pulls older regex/numpy; keep floors for transformers / scipy
    "regex>=2025.10.22",
    "numpy>=1.26.4,<2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]

[project.scripts]
jobtracker = "jobtracker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.hatch.build.targets.wheel]
packages = ["src/jobtracker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/jobtracker --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: tests requiring a live Postgres (skipped if DB is unreachable)",
]

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.10",
]
